name: Release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    concurrency:
      group: issuebot-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - id: identity
        name: Validate release version
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-list --parents -n 1 HEAD | awk '{ print NF }')" = 3
          base_ref="$(git rev-parse HEAD^1)"
          version="$(uv run python tools/release_version.py --base-ref "$base_ref")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wheel=dist/issuebot-$version-py3-none-any.whl" >> "$GITHUB_OUTPUT"
      - run: uv run pytest -q
      - run: ./tools/check.sh
      - run: uv build --wheel
      - name: Verify wheel
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          WHEEL: ${{ steps.identity.outputs.wheel }}
        run: |
          test "$(find dist -name '*.whl' | wc -l | tr -d ' ')" = 1
          test -f "$WHEEL"
          python -c 'import sys,zipfile; from email.parser import Parser; wheel,version=sys.argv[1:]; archive=zipfile.ZipFile(wheel); metadata=Parser().parsestr(archive.read(f"issuebot-{version}.dist-info/METADATA").decode()); assert metadata["Version"] == version' "$WHEEL" "$VERSION"
      - name: Refuse existing release state
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          if git rev-parse --verify --quiet "refs/tags/v$VERSION"; then
            echo "release tag v$VERSION already exists" >&2
            exit 1
          fi
          set +e
          release_response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" 2>&1)"
          api_status=$?
          set -e
          http_status="$(printf '%s\n' "$release_response" | awk '$1 ~ /^HTTP\// { status=$2 } END { print status }')"
          case "$http_status" in
            404)
              ;;
            2??)
              echo "release v$VERSION already exists" >&2
              exit 1
              ;;
            *)
              printf '%s\n' "$release_response" >&2
              if [ "$api_status" -ne 0 ]; then
                exit "$api_status"
              fi
              exit 1
              ;;
          esac
      - name: Reserve release tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        shell: bash
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$VERSION" \
            -f sha="$RELEASE_SHA" >/dev/null
          remote_target="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq '.object.sha')"
          test "$remote_target" = "$RELEASE_SHA"
      - name: Create release draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
          WHEEL: ${{ steps.identity.outputs.wheel }}
        run: gh release create "v$VERSION" "$WHEEL" install.sh --draft --verify-tag --title "issuebot $VERSION" --generate-notes
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false --latest
