name: Pull request

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reject SHA-like head branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          if [[ "$HEAD_REF" =~ ^[0-9a-fA-F]{7,64}$ ]]; then
            echo "pull request head branch must not look like a Git object ID" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Validate release version
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --tags
          uv run python tools/release_version.py --base-ref "origin/${{ github.base_ref }}"
      - run: uv run pytest -q
      - run: ./tools/check.sh
